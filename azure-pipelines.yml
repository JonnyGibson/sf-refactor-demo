trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

steps:
- task: UseDotNet@2
  inputs:
    packageType: 'sdk'
    version: '9.0.x'
    installationPath: $(Agent.ToolsDirectory)/dotnet

- script: dotnet restore RefactorDemo.sln
  displayName: 'Restore NuGet packages'

- script: dotnet build RefactorDemo.sln --configuration Release --no-restore
  displayName: 'Build solution'

- script: dotnet test RefactorDemo.sln --no-build --verbosity normal
  displayName: 'Run tests'
